<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Window</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="start-screen" aria-label="시작 화면" data-screen="start">
      <section class="logo-wrap" aria-label="앱 로고 영역">
        <p class="logo-kicker">calm focus ambience</p>
        <h1 class="logo-title">Quiet Window</h1>
      </section>

      <nav class="start-actions" aria-label="시작 메뉴">
        <button type="button" class="action-button action-button-primary" id="start-button">시작하기</button>
        <button type="button" class="action-button">설정</button>
        <button type="button" class="action-button">나가기</button>
      </nav>
    </main>

    <main class="scene-screen is-hidden" aria-label="풍경 선택 화면" data-screen="scene">
      <header class="scene-header">
        <h2>풍경 선택</h2>
        <p class="scene-progress" id="scene-progress">1 / 5</p>
      </header>

      <section class="scene-card" aria-label="현재 풍경 카드">
        <button type="button" class="scene-arrow" aria-label="이전 풍경" data-direction="prev">&#8592;</button>
        <article class="scene-card-body">
          <div class="scene-image-placeholder" id="scene-image-placeholder" aria-hidden="true"></div>
          <h3 id="scene-title">다락방</h3>
          <p id="scene-description">빗소리와 함께 조용히 머물 수 있는 다락방 풍경</p>
        </article>
        <button type="button" class="scene-arrow" aria-label="다음 풍경" data-direction="next">&#8594;</button>
      </section>

      <footer class="scene-footer">
        <button type="button" class="action-button action-button-primary" id="select-scene-button">선택</button>
      </footer>
    </main>

    <main class="main-screen is-hidden" aria-label="메인 화면" data-screen="main">
      <header class="main-topbar">
        <h2 id="main-scene-title">다락방</h2>
        <div class="main-options" aria-label="풍경 옵션 버튼">
          <div class="selector-group">
            <button type="button" class="option-button" id="env-toggle" aria-expanded="false" aria-controls="env-panel">환경 선택: 맑음 · 아침</button>
            <div class="selector-panel selector-panel-grid is-hidden" id="env-panel" role="menu" aria-label="날씨 및 시간대 선택">
              <section class="selector-column" aria-label="날씨 선택">
                <h3>날씨</h3>
                <button type="button" class="selector-option" data-type="weather" data-value="맑음">맑음</button>
                <button type="button" class="selector-option" data-type="weather" data-value="비">비</button>
                <button type="button" class="selector-option" data-type="weather" data-value="눈">눈</button>
              </section>

              <section class="selector-column" aria-label="시간대 선택">
                <h3>시간대</h3>
                <button type="button" class="selector-option" data-type="time" data-value="아침">아침</button>
                <button type="button" class="selector-option" data-type="time" data-value="노을">노을</button>
                <button type="button" class="selector-option" data-type="time" data-value="저녁">저녁</button>
              </section>
            </div>
          </div>
        </div>
      </header>

      <section class="main-stage" aria-label="현재 풍경 배경 영역">
        <div class="window-stage" id="window-stage">
          <div class="main-scene-image" id="main-scene-image" aria-hidden="true"></div>
          <div class="time-overlay" id="time-overlay" aria-hidden="true"></div>
          <canvas id="weather-canvas" class="weather-canvas" aria-hidden="true"></canvas>
        </div>
      </section>

      <footer class="main-footer">
        <button type="button" class="action-button action-button-primary" id="mixer-toggle" aria-expanded="false" aria-controls="mixer-panel">사운드 믹서 열기</button>
        <section class="mixer-panel is-hidden" id="mixer-panel" aria-label="사운드 믹서">
          <div class="mixer-header">
            <h3>사운드 믹서</h3>
            <p>각 소리의 크기를 직접 조절하세요.</p>
          </div>
          <div class="mixer-list" id="mixer-list"></div>
        </section>
      </footer>
    </main>

    <script src="main.js"></script>
  </body>
</html>
